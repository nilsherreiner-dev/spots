<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spots">
<meta name="app-version" content="2026.11.25-5">
<meta name="theme-color" content="#16313a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Spots</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
/*
VOICE: ruhig und persönlich, wie ein eigenes Notizbuch voller Lieblingsorte
IDEA: eine Landkarte ganz ohne Beschriftung, auf die man Fotos pinnt
PICTURE: die randlose Karte selbst, Fotopins als runde Stecknadeln mit weißem Rand
COLOUR/TYPE: Kartengrund, Koralle als einziger Akzent, Sterne in Gold; DM Sans
LAYOUT: Vollbildkarte, schwebende Knöpfe unten rechts, alles andere in Bottom-Sheets
*/
:root{--bg:#fff;--ink:#16191d;--mut:#6b7280;--line:#e6e7ea;--chip:rgba(255,255,255,.93);--acc:#f2542d;--gold:#f5b301;--field:#f2f3f5;--sh:0 6px 24px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1d21;--ink:#f2f3f5;--mut:#9aa0a8;--line:#30333a;--chip:rgba(32,34,38,.92);--field:#272a30}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{height:100%;min-height:var(--appH,100%);overflow:hidden;background:#f6f1e4}
body{margin:0;position:relative;height:100%;height:var(--appH,100%);overflow:hidden;background:#f6f1e4;--sb:max(env(safe-area-inset-bottom),22px)}
body{font:16px/1.5 'DM Sans',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:absolute;inset:0;z-index:0;background:#f6f1e4}
body[data-mapstyle=nacht] #map{background:#1e2827}
body[data-mapstyle=schlicht] #map{background:#f5f3f0}body[data-mapstyle=natur] #map{background:#f6f1e4}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:absolute;top:calc(env(safe-area-inset-top) + 30px);left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;z-index:500;pointer-events:none}
.top>*{pointer-events:auto}
.topfade{position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 18px);background:linear-gradient(var(--fade,#f6f1e4),transparent);opacity:.85;z-index:450;pointer-events:none}
.chip{background:var(--chip);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;box-shadow:var(--sh);height:44px;padding:0 16px;display:flex;align-items:center;gap:9px;border:0;font-weight:700;white-space:nowrap}
.chip.ic{width:44px;padding:0;justify-content:center}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#9aa0a8}.dot.ok{background:#22c55e}.dot.off{background:#f59e0b}.dot.err{background:#ef4444}
.fabs{position:absolute;right:14px;bottom:calc(var(--sb) + 14px);display:flex;flex-direction:column;gap:10px;z-index:500;align-items:center}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--chip);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--sh);display:grid;place-items:center}
.fab.main{width:64px;height:64px;background:var(--acc);color:#fff}
.fab.main svg{width:28px;height:28px;stroke-width:2.4}
.leaflet-control-attribution{font:10px/1.4 'DM Sans',sans-serif!important;background:rgba(255,255,255,.6)!important;border-radius:6px 0 0 0}
.leaflet-bottom.leaflet-left{margin-bottom:calc(var(--sb) - 6px)}

.pin{background:none;border:0}
.pin-b{position:relative;width:48px;height:48px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.pin-b img,.leaflet-container .leaflet-marker-pane .pin-b img{width:42px!important;height:42px!important;max-width:42px!important;max-height:42px!important;border-radius:50%;object-fit:cover;display:block}
.pin-b::after{content:'';position:absolute;left:50%;top:100%;margin-top:-1px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #fff}
.me{width:18px;height:18px;border-radius:50%;background:#2f80ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,128,255,.22)}

#cross{position:absolute;left:50%;top:50%;width:48px;height:58px;margin:-58px 0 0 -24px;z-index:600;pointer-events:none;display:none}
#placeHint{position:absolute;top:calc(env(safe-area-inset-top) + 30px);left:50%;transform:translateX(-50%);z-index:600;display:none;font-weight:500}
#placeBar{position:absolute;left:14px;right:14px;bottom:calc(var(--sb) + 14px);z-index:600;display:none;gap:10px;max-width:520px;margin:0 auto}
#placeBar .btn{flex:1;box-shadow:var(--sh)}
body.placing #cross,body.placing #placeHint{display:block}
body.placing #placeBar{display:flex}
body.placing .fabs,body.placing .top{display:none}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:900}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.22);max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 20px calc(var(--sb) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.x{position:absolute;right:10px;top:8px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--mut)}
h2{font-size:24px;line-height:1.1;margin:6px 48px 16px 0;text-wrap:balance}
h3{font-size:16px;margin:22px 0 8px}
.mut{color:var(--mut)}.small{font-size:14px}
p{margin:0 0 10px}

.btn{min-height:48px;border-radius:14px;border:0;padding:0 18px;font-weight:700;background:var(--field);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--acc);color:#fff}
.btn.danger{color:#e5484d}
.btn.wide{width:100%;margin-top:8px}
.btn:focus-visible,.fab:focus-visible,.chip:focus-visible,.choice:focus-visible,.item:focus-visible,.st:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row-btns{display:flex;gap:10px;margin-top:18px}.row-btns .btn{flex:1}
.linkbtn{border:0;background:none;color:var(--acc);font-weight:700;padding:10px 0;min-height:44px}

.form label{display:block;font-size:14px;font-weight:500;color:var(--mut);margin-bottom:12px}
input,textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{border-color:var(--acc)}
.addrrow{display:flex;gap:8px;align-items:flex-end}.addrrow label{flex:1;margin:0}
.addrrow .btn{width:48px;padding:0;flex:none;margin-bottom:0}
.photo{display:flex!important;align-items:center;gap:16px;margin-bottom:16px!important}
.photo .t{font-weight:700;color:var(--acc);font-size:16px}
.photo input{display:none}

.av{width:84px;height:84px;border-radius:50%;flex:none;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:28px;overflow:hidden;border:3px solid var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.s{width:46px;height:46px;font-size:16px;border-width:2px}
.av.ph{background:var(--field);color:var(--mut);box-shadow:none;border:2px dashed var(--line)}

.stars{display:inline-flex;gap:1px;flex:none}
.st{width:24px;height:24px;padding:0;border:0;background:none;color:var(--line);display:inline-grid;place-items:center}
.st svg{width:100%;height:100%;fill:currentColor}
.st.on{color:var(--gold)}
.form .st{width:42px;height:42px;padding:5px}
.rate{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.rate>span:first-child{font-weight:500}
.rate .n{font-variant-numeric:tabular-nums;color:var(--mut);width:2.2em;text-align:right;white-space:nowrap}
.rate .r{display:flex;align-items:center;gap:6px}

.head{display:flex;gap:16px;align-items:center;margin:6px 44px 4px 0}
.head h2{margin:0 0 2px}
.addr{color:var(--mut);margin:0;font-size:15px}
.score{display:flex;align-items:center;gap:14px;margin:18px 0 10px;padding:14px 16px;border-radius:16px;background:var(--field)}
.score b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.score .st{width:28px;height:28px}
.score small{display:block;color:var(--mut);font-size:14px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}
.ext{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:700;text-decoration:none;min-height:44px}

.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;border-radius:16px;background:var(--field);margin-bottom:10px;text-align:left;font-weight:700}
.choice small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.choice .c{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.searchrow{display:flex;gap:8px;align-items:center}.searchrow input{margin:0}.searchrow .btn{flex:none}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-height:56px}
.item .t{flex:1}.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .t small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{width:15px;height:15px}
.empty{color:var(--mut);padding:18px 0;text-align:center}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg .btn{padding:0 8px}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 86px);transform:translate(-50%,-10px);background:#16191d;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

#setup{position:absolute;inset:0;z-index:2000;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 28px);display:none}
body.needs-setup #setup{display:block}
#setup .wrap{max-width:520px;margin:0 auto}
#setup h1{font-size:44px;line-height:1.05;margin:10px 0 8px}
#setup .art{display:block;width:100%;height:auto;border-radius:22px;margin-bottom:18px}
#setup ol{padding-left:20px;margin:6px 0 14px;color:var(--mut)}

.err{color:#e5484d;font-weight:500;min-height:1.5em;margin-top:10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="topfade"></div>

<div class="top">
  <button class="chip" data-act="list" aria-label="Alle Spots anzeigen"><span class="dot" id="dot"></span><span id="stxt">Spots</span></button>
  <button class="chip ic" data-act="settings" aria-label="Einstellungen" data-ic="gear"></button>
</div>
<div class="fabs">
  <button class="fab" data-act="fit" aria-label="Alle Spots zeigen" data-ic="fit"></button>
  <button class="fab" data-act="me" aria-label="Mein Standort" data-ic="loc"></button>
  <button class="fab main" data-act="add" aria-label="Spot hinzufügen" data-ic="plus"></button>
</div>

<svg id="cross" viewBox="0 0 48 58" aria-hidden="true"><path d="M24 57 16 44h16z" fill="#fff"/><circle cx="24" cy="24" r="21" fill="#f2542d" stroke="#fff" stroke-width="3"/><circle cx="24" cy="24" r="5" fill="#fff"/></svg>
<div id="placeHint" class="chip">Karte verschieben, bis die Nadel sitzt</div>
<div id="placeBar"><button class="btn" data-act="place-cancel">Abbrechen</button><button class="btn primary" data-act="place-ok">Hier setzen</button></div>

<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details">
  <div class="grab"></div>
  <button class="x" data-act="close" aria-label="Schließen" data-ic="x"></button>
  <div id="sb"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="setup">
  <form class="wrap form" id="setupForm">
    <svg class="art" viewBox="0 0 520 220" aria-hidden="true">
      <rect width="520" height="220" fill="#16313a"/>
      <g fill="none" stroke="#2c5560" stroke-width="2">
        <path d="M-10 60C80 30 140 90 230 70S400 10 530 50"/><path d="M-10 110C90 80 160 140 260 118S420 70 530 104"/>
        <path d="M-10 160C70 140 170 190 270 168S430 130 530 158"/><path d="M-10 205C100 180 190 230 300 210S440 185 530 200"/>
      </g>
      <g transform="translate(150 54)"><path d="M24 57 16 44h16z" fill="#fff"/><circle cx="24" cy="24" r="21" fill="#f5b301" stroke="#fff" stroke-width="3"/></g>
      <g transform="translate(340 96)"><path d="M24 57 16 44h16z" fill="#fff"/><circle cx="24" cy="24" r="21" fill="#7cc4b8" stroke="#fff" stroke-width="3"/></g>
      <g transform="translate(232 70) scale(1.5)"><path d="M24 57 16 44h16z" fill="#fff"/><circle cx="24" cy="24" r="21" fill="#f2542d" stroke="#fff" stroke-width="3"/><circle cx="24" cy="24" r="6" fill="#fff"/></g>
    </svg>
    <h1>Spots</h1>
    <p class="mut">Eure gemeinsame Karte. Einmal anmelden – danach bleibt die App auf diesem Handy angemeldet, auch nach Updates.</p>
    <label>E-Mail<input id="lgEmail" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" inputmode="email"></label>
    <label>Passwort<input id="lgPw" type="password" autocomplete="current-password"></label>
    <button class="btn primary wide" type="submit" id="lgBtn">Anmelden</button>
    <p class="err" id="setupErr"></p>
  </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script type="module">
{

    wet: '#cfe6d8', sand: '#f3e3bc', rock: '#e4ded4', ice: '#f3f8fa', wood: '#b3d6a0', woodEdge: '#93c283', tree: '#6fa968', paisle: '#7fae8c', parkDot: '#b5a995', dotRing: '#ffffff', prot: '#6fbf8f', protLine: '#5f9f76',

  nacht: { bg: '#1e2827', farm: '#252f29', resid: '#242d2d', indus: '#282c2e', grass: '#26372b', park: '#2b4431', cem: '#283a2e', pitch: '#2a3d2e',
    wet: '#22383a', sand: '#38342a', rock: '#2b2f2f', ice: '#2d383c', wood: '#2f5137', woodEdge: '#3d6646', tree: '#5d9a66', paisle: '#4f7d60', parkDot: '#6b716d', dotRing: '#1e2827', prot: '#5fbf86', protLine: '#7fd3a2',

function buildStyle(P) {

  const L = [
    { id: 'bg', type: 'background', paint: { 'background-color': P.bg } },
    { id: 'relief', type: 'raster', source: 'ne2', maxzoom: 8, paint: { 'raster-opacity': ['interpolate', ['linear'], ['zoom'], 0, P.relief, 7, 0], 'raster-saturation': -0.55, 'raster-brightness-max': P.bright } },
    fill('farm', 'landcover', cls('farmland'), P.farm),
    fill('resid', 'landuse', cls('residential', 'suburb', 'neighbourhood', 'quarter'), P.resid, { 'fill-opacity': 0.85 }),
    fill('indus', 'landuse', cls('industrial', 'commercial', 'retail', 'railway', 'garages'), P.indus),
    fill('grass', 'landcover', ['all', cls('grass'), ['!=', ['get', 'subclass'], 'park']], P.grass),

    fill('rock', 'landcover', cls('rock'), P.rock),
    fill('ice', 'landcover', cls('ice'), P.ice),
    fill('wood', 'landcover', cls('wood'), P.wood, { 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 4, 0.55, 9, 1] }),
    { id: 'wood-pattern', type: 'fill', source: S, 'source-layer': 'landcover', minzoom: 11, filter: cls('wood'), paint: { 'fill-pattern': 'trees-' + P.tree.slice(1), 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 11, 0, 12.5, 0.85] } },
    { id: 'wood-edge', type: 'line', source: S, 'source-layer': 'landcover', minzoom: 11, filter: cls('wood'), paint: { 'line-color': P.woodEdge, 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.4, 16, 1.3], 'line-opacity': 0.8 } },

  const d = draft; if (!d) return;
  const f = $('#fAddr'); if (f) f.placeholder = 'Adresse wird ermittelt…';
  reverseGeo(d.lat, d.lng).then(a => {
    if (draft !== d) return;
    d.autoAddr = a;
    const f2 = $('#fAddr');
    if (f2 && (!f2.value.trim() || f2.dataset.auto === '1')) { f2.value = a; f2.dataset.auto = '1'; }
    d.address = f2 ? f2.value.trim() : a;
  }).catch(() => { const f3 = $('#fAddr'); if (f3) f3.placeholder = 'Adresse nicht gefunden – selbst eintragen'; });
}
function renderStars(k) {
  const el = $(`#sb .stars[data-for="${k}"]`); if (!el || !draft) return;
  el.outerHTML = stars(k, draft.r[k], true);
  $('#n-' + k).textContent = draft.r[k] + '/5';
}
function showProfile(id, keepView) {
  const p = pins.get(id); if (!p) return;
  if (!keepView) panAbove([p.lat, p.lng]);
  const r = p.r || {};
  const when = fmtDate(p.updatedAt) || fmtDate(p.createdAt);
  open(`<div class="head">${avatar(p)}<div><h2>${esc(p.name)}</h2><p class="addr">${esc(p.address || 'Keine Adresse')}</p></div></div>
    <div class="score"><b>${clampR(r.g)}</b><div>${stars('g', clampR(r.g))}<small>Gesamt von 5</small></div></div>
    ${CATS.slice(1).map(([k, l]) => `<div class="rate"><span>${l}</span><span class="r">${stars(k, clampR(r[k]))}<span class="n">${clampR(r[k])}/5</span></span></div>`).join('')}
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : '<p class="desc mut">Noch keine Beschreibung.</p>'}
    <a class="ext" href="https://maps.apple.com/?ll=${p.lat},${p.lng}&q=${encodeURIComponent(p.name)}">${ico('ext')} In Apple Karten öffnen</a>
    <div class="row-btns"><button class="btn danger" data-act="del">Löschen</button><button class="btn primary" data-act="edit">Bearbeiten</button></div>
    ${when ? `<p class="small mut" style="margin-top:12px">Zuletzt geändert am ${esc(when)}</p>` : ''}`, 'profile');
  openId = id;
}
function listHtml(arr) {
  if (!arr.length) return '<p class="empty">Keine Spots gefunden.</p>';
  return arr.map(p => `<button class="item" data-act="open" data-id="${esc(p.id)}">${avatar(p, 's')}<span class="t"><b>${esc(p.name)}</b><small>${esc(p.address || '')}</small></span>${stars('g', clampR(p.r && p.r.g))}</button>`).join('');
}
function sortedPins() {
  return [...pins.values()].sort((a, b) => clampR(b.r && b.r.g) - clampR(a.r && a.r.g) || String(a.name).localeCompare(String(b.name), 'de'));
}
function showList() {
  const arr = sortedPins();
  if (!arr.length) {
    open(`<h2>Noch keine Spots</h2><p class="mut">Tippe auf den Plus-Knopf unten rechts, um euren ersten Ort zu setzen – per Standort, Adresse oder direkt auf der Karte.</p><button class="btn primary wide" data-act="add">Ersten Spot hinzufügen</button>`, 'list');
    return;
  }
  open(`<h2>Alle Spots <span class="mut">${arr.length}</span></h2>
    ${arr.length > 5 ? '<input id="lq" type="search" placeholder="Filtern nach Name oder Adresse" aria-label="Filtern" style="margin:0 0 8px">' : ''}
    <div id="lres">${listHtml(arr)}</div>`, 'list');
}
function showSettings() {
  const cur = document.body.dataset.mapstyle;
  open(`<h2>Einstellungen</h2>
    <h3 style="margin-top:4px">Kartenstil</h3>
    <div class="seg">${Object.entries(STYLES).map(([k, s]) => `<button class="btn${cur === k ? ' primary' : ''}" data-act="style" data-v="${k}">${s.name}</button>`).join('')}</div>
    <h3>Konto</h3>
    <p class="mut small" style="margin:0 0 4px">Angemeldet als <b>${esc(userEmail || '–')}</b></p>
    <button class="btn danger wide" data-act="logout">Abmelden</button>
    <h3>App</h3>
    <p class="mut small" style="margin:0 0 4px">Version ${esc(APP_VERSION)} · Updates werden automatisch geladen.</p>
    <button class="btn wide" data-act="checkupdate">Jetzt nach Updates suchen</button>`, 'settings');
}
function confirmBox(title, text, yesLabel, act, id) {
  open(`<h2>${esc(title)}</h2><p class="mut">${esc(text)}</p>
    <div class="row-btns"><button class="btn" data-act="${id ? 'back' : 'close'}" ${id ? `data-id="${esc(id)}"` : ''}>Abbrechen</button><button class="btn primary" style="background:#e5484d" data-act="${act}" ${id ? `data-id="${esc(id)}"` : ''}>${esc(yesLabel)}</button></div>`, 'confirm');
}

/* ---------- Placement mode ---------- */
function startPlacing(done, cancel, at) {
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  if (at) map.setView(at, Math.max(map.getZoom(), 16));
  document.body.classList.add('placing');
  placing = { done, cancel };
}
function endPlacing(ok) {
  const p = placing; placing = null;
  document.body.classList.remove('placing');
  if (!p) return;
  if (ok) { const c = map.getCenter(); p.done(c.lat, c.lng); } else if (p.cancel) p.cancel();
}

/* ---------- Photos ---------- */
async function toThumb(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild konnte nicht gelesen werden')); i.src = url; });
    const S = 320, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, S, S);
    return c.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Firebase ---------- */
const errHint = e => (e && e.code === 'permission-denied') ? 'Keine Berechtigung – Firestore-Regeln prüfen.' : ((e && e.message) || 'Unbekannter Fehler');
function showLogin(msg) {
  document.body.classList.add('needs-setup');
  $('#setupErr').textContent = msg || '';
  setStatus('Abgemeldet');
}
function stopSync() {
  if (unsub) { unsub(); unsub = null; }
  for (const m of markers.values()) m.remove();
  markers.clear(); pins.clear(); firstSnap = true;
}
function startSync() {
  if (unsub || !fs) return;
  setStatus('Lade…');
  unsub = fs.F.onSnapshot(fs.col, { includeMetadataChanges: true }, onSnap, err => { setStatus('Fehler', 'err'); toast(errHint(err), 6000); });
  migrateOld();
}
/* Spots aus der alten Einzel-Karte (Version mit Zugangsschlüssel) einmalig übernehmen */
async function migrateOld() {
  const old = LS.get('spots.cfg', null);
  if (!old || !old.k || old.k === MAP_ID || LS.get('spots.migrated.' + old.k, false)) return;
  try {
    const { F } = fs;
    const snap = await F.getDocs(F.collection(fs.db, 'karten', old.k, 'pins'));
    let n = 0;
    for (const d of snap.docs) { await F.setDoc(F.doc(fs.col, d.id), d.data(), { merge: true }); n++; }
    LS.set('spots.migrated.' + old.k, true);
    if (n) toast(`${n} ${n === 1 ? 'Spot' : 'Spots'} in die gemeinsame Karte übernommen`, 4000);
  } catch (e) { /* alte Karte nicht lesbar – nichts zu tun */ }
}
async function connect() {
  const old = LS.get('spots.cfg', null);
  const cfg = FIREBASE_CONFIG || (old && old.c);
  if (!cfg) { showLogin('Die Firebase-Konfiguration fehlt in index.html.'); return; }
  setStatus('Verbinde…');
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A, F, Au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = A.getApps().length ? A.getApp() : A.initializeApp(cfg);
    const auth = Au.getAuth(app);
    let db;
    try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); } catch { db = F.getFirestore(app); }
    fs = { F, Au, auth, db, col: F.collection(db, 'karten', MAP_ID, 'pins') };
    Au.onAuthStateChanged(auth, user => {
      if (user) { userEmail = user.email || ''; document.body.classList.remove('needs-setup'); startSync(); }
      else { userEmail = ''; stopSync(); showLogin(); }
    });
  } catch (e) {
    setStatus('Offline', 'err');
    toast('Verbindung fehlgeschlagen: ' + errHint(e), 6000);
  }
}
async function login() {
  const err = $('#setupErr'), btn = $('#lgBtn');
  const email = $('#lgEmail').value.trim(), pw = $('#lgPw').value;
  if (!email || !pw) { err.textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }
  if (!fs) { err.textContent = 'Noch keine Verbindung – kurz warten und nochmal versuchen.'; connect(); return; }
  btn.disabled = true; btn.textContent = 'Anmelden…'; err.textContent = '';
  try { await fs.Au.signInWithEmailAndPassword(fs.auth, email, pw); $('#lgPw').value = ''; toast('Angemeldet'); }
  catch (e) {
    const c = e && e.code || '';
    err.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? 'E-Mail oder Passwort stimmt nicht.'
      : c.includes('too-many-requests') ? 'Zu viele Versuche – bitte kurz warten.'
      : c.includes('network') ? 'Keine Internetverbindung.'
      : c.includes('operation-not-allowed') ? 'E-Mail-Anmeldung ist in Firebase noch nicht aktiviert.'
      : 'Anmeldung fehlgeschlagen: ' + (e && e.message || c);
  } finally { btn.disabled = false; btn.textContent = 'Anmelden'; }
}

/* ---------- Auto-Update ---------- */
async function checkUpdate(manual) {
  try {
    const r = await fetch(location.pathname + '?vcheck=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
    if (m && m[1] !== APP_VERSION) {
      let tries = 0; try { tries = +sessionStorage.getItem('spots.upd.' + m[1]) || 0; sessionStorage.setItem('spots.upd.' + m[1], tries + 1); } catch {}
      if (tries < 2) { updatePending = m[1]; applyUpdate(); return; }
    }
    if (manual) toast('Die App ist aktuell');
  } catch { if (manual) toast('Keine Verbindung'); }
}
function applyUpdate() {
  if (!updatePending || mode === 'form' || placing) return; // nie mitten im Bearbeiten neu laden
  toast('Neue Version wird geladen…');
  const v = updatePending; updatePending = null;
  setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(v)), 700);
}
function onSnap(snap) {
  const seen = new Set();
  snap.forEach(d => {
    const x = d.data() || {};
    if (!finite(x.lat) || !finite(x.lng)) return;
    const p = { id: d.id, name: String(x.name || 'Ohne Namen').slice(0, 80), desc: String(x.desc || '').slice(0, 1000), address: String(x.address || '').slice(0, 200), lat: x.lat, lng: x.lng, photo: okPhoto(x.photo) ? x.photo : '', r: x.r || {}, createdAt: x.createdAt, updatedAt: x.updatedAt };
    seen.add(d.id); pins.set(d.id, p); upsertMarker(p);
  });
  for (const id of [...pins.keys()]) if (!seen.has(id)) { pins.delete(id); const m = markers.get(id); if (m) m.remove(); markers.delete(id); }
  const n = pins.size;
  setStatus(`${n} ${n === 1 ? 'Spot' : 'Spots'}${snap.metadata.fromCache ? ' · offline' : ''}`, snap.metadata.fromCache ? 'off' : 'ok');
  if (firstSnap) { firstSnap = false; if (n && !hadView) fitAll(); }
  if (mode === 'profile' && openId) {
    if (!pins.has(openId)) { closeSheet(); toast('Dieser Spot wurde gelöscht'); }
    else if (snap.docChanges({ includeMetadataChanges: false }).some(c => c.doc.id === openId)) { const y = $('#sheet').scrollTop; showProfile(openId, true); $('#sheet').scrollTop = y; }
  }
  if (mode === 'list' && !$('#lq')) showList();
}
function savePin() {
  syncDraft();
  const d = draft;
  if (!d) return;
  if (!d.name) { toast('Bitte gib dem Spot einen Namen'); $('#fName').focus(); return; }
  if (!fs) { toast('Nicht verbunden'); return; }
  const { F } = fs;
  const data = { name: d.name, desc: d.desc, address: d.address, lat: d.lat, lng: d.lng, photo: d.photo || '', r: { g: clampR(d.r.g), a: clampR(d.r.a), u: clampR(d.r.u) }, updatedAt: F.serverTimestamp() };
  let id = d.id, pr;
  if (id) pr = F.updateDoc(F.doc(fs.col, id), data);
  else { const ref = F.doc(fs.col); id = ref.id; data.createdAt = F.serverTimestamp(); pr = F.setDoc(ref, data); }
  pr.catch(e => toast('Speichern fehlgeschlagen: ' + errHint(e), 6000));
  closeSheet();
  setTimeout(() => { if (pins.has(id)) showProfile(id); }, 250);
}
function deletePin(id) {
  if (!fs || !id) return;
  fs.F.deleteDoc(fs.F.doc(fs.col, id)).catch(e => toast('Löschen fehlgeschlagen: ' + errHint(e), 6000));
  closeSheet(); toast('Spot gelöscht');
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const st = e.target.closest('[data-star]');
  if (st && draft) { const k = st.dataset.star, v = +st.dataset.v; draft.r[k] = draft.r[k] === v ? 0 : v; renderStars(k); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'close') closeSheet();
  else if (a === 'add') showAdd();
  else if (a === 'add-search') showSearch();
  else if (a === 'add-here') {
    toast('Standort wird ermittelt…');
    locate().then(ll => { showMe(ll); map.setView(ll, 17); newDraft(ll[0], ll[1]); }).catch(er => toast(er.message, 5000));
  }
  else if (a === 'add-pick') { closeSheet(); startPlacing((lat, lng) => newDraft(lat, lng)); }
  else if (a === 'place-ok') endPlacing(true);
  else if (a === 'place-cancel') endPlacing(false);
  else if (a === 'res') {
    const r = results[+b.dataset.i]; if (!r) return;
    const lat = +r.lat, lng = +r.lon;
    map.setView([lat, lng], 17); newDraft(lat, lng, fmtAddr(r));
  }
  else if (a === 'me') locate().then(ll => { showMe(ll); map.flyTo(ll, Math.max(map.getZoom(), 15)); }).catch(er => toast(er.message, 5000));
  else if (a === 'fit') fitAll();
  else if (a === 'list') showList();
  else if (a === 'open') { const p = pins.get(b.dataset.id); if (p) { map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15)); showProfile(p.id); } }
  else if (a === 'settings') showSettings();
  else if (a === 'style') { setStyle(b.dataset.v); showSettings(); }
  else if (a === 'logout') confirmBox('Abmelden?', 'Die Spots bleiben gespeichert. Zum erneuten Anmelden brauchst du E-Mail und Passwort.', 'Abmelden', 'logout-yes');
  else if (a === 'logout-yes') { closeSheet(); if (fs) fs.Au.signOut(fs.auth); }
  else if (a === 'checkupdate') { toast('Suche nach Updates…'); checkUpdate(true); }
  else if (a === 'edit') {
    const p = pins.get(openId); if (!p) return;
    const id = openId;
    open('', 'form'); openId = null;
    draft = { id, name: p.name, desc: p.desc, address: p.address, autoAddr: '', lat: p.lat, lng: p.lng, photo: p.photo, r: { g: clampR(p.r.g), a: clampR(p.r.a), u: clampR(p.r.u) } };
    showForm();
  }
  else if (a === 'del') { const p = pins.get(openId); if (p) confirmBox(`„${p.name}“ löschen?`, 'Der Spot verschwindet auf allen verbundenen Handys. Das lässt sich nicht rückgängig machen.', 'Löschen', 'del-yes', p.id); }
  else if (a === 'del-yes') deletePin(b.dataset.id);
  else if (a === 'back') { if (pins.has(b.dataset.id)) showProfile(b.dataset.id, true); else closeSheet(); }
  else if (a === 'cancel') { const id = draft && draft.id; draft = null; if (id && pins.has(id)) showProfile(id, true); else closeSheet(); }
  else if (a === 'rmphoto') { syncDraft(); draft.photo = ''; showForm(); }
  else if (a === 'readdr') { syncDraft(); const f = $('#fAddr'); f.value = ''; f.dataset.auto = '1'; draft.address = ''; autoAddress(); }
  else if (a === 'move') {
    syncDraft(); const d = draft;
    startPlacing((lat, lng) => {
      draft = d; d.lat = lat; d.lng = lng;
      const wasAuto = !d.address || d.address === d.autoAddr;
      if (wasAuto) d.address = '';
      showForm();
      if (!wasAuto) toast('Position geändert – Adresse ggf. mit ↻ neu ermitteln', 4000);
    }, () => { draft = d; showForm(); }, [d.lat, d.lng]);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'pf') savePin();
  else if (e.target.id === 'sf') doSearch();
  else if (e.target.id === 'setupForm') login();
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'photoIn' || !draft) return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { syncDraft(); draft.photo = await toThumb(f); showForm(); } catch (er) { toast(er.message); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'lq') {
    const q = e.target.value.trim().toLowerCase();
    $('#lres').innerHTML = listHtml(sortedPins().filter(p => (p.name + ' ' + p.address).toLowerCase().includes(q)));
  } else if (e.target.id === 'fAddr') e.target.dataset.auto = '0';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (placing) endPlacing(false); else closeSheet(); } });

/* ---------- Start ---------- */
for (const el of document.querySelectorAll('[data-ic]')) el.innerHTML = ico(el.dataset.ic);
if (typeof L === 'undefined') {
  document.body.innerHTML = '<p style="padding:40px 24px;font:17px/1.5 system-ui">Die Karte konnte nicht geladen werden. Bitte Internetverbindung prüfen und die App neu öffnen.</p>';
} else {
  fitScreen();
  initMap();
  connect();
  setTimeout(() => checkUpdate(false), 2500);
  setInterval(() => checkUpdate(false), 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(false); });
}
}
</script>
